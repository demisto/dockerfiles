# =============================================================================
# ONE-TIME signature-repo provisioning job (CIAC-16370)
# =============================================================================
# !!! TEMPORARY -- DELETE THIS FILE AND ITS `include` AFTER A SINGLE SUCCESSFUL RUN !!!
#
# Creates the Docker Hub repos that cosign pushes signatures into:
#   demisto-signatures/cosign-test
#   devdemisto-signatures/cosign-test
# so that cosign's pre-push manifest check stops returning
# "UNAUTHORIZED: authentication required".
#
# The job is `when: manual` -- it never runs automatically. Trigger it once from
# the pipeline UI, confirm success, then remove this file and the matching line
# in /.gitlab/.gitlab-ci.yml.
#
# Requires the same masked CI/CD variables the cosign job uses:
#   DOCKERHUB_USER, DOCKERHUB_PASSWORD (with rights to create repos in the two
#   *-signatures namespaces).
# =============================================================================

create-signature-repos:
  stage: sign
  image: docker:27-cli
  when: manual
  allow_failure: true
  variables:
    SIG_NAMESPACES: "demisto-signatures devdemisto-signatures"
    SIG_IMAGES: "cosign-test"
    REPO_PRIVATE: "true"
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash cosign/create_signature_repos.sh
