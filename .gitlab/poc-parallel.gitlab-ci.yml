# =============================================================================
# CIAC-17423 — PARALLEL BUILD POC (additive overlay for the MR pipeline)
# =============================================================================
# Purpose: prove on CI that building each changed docker image in its OWN job
# (per-image parallelism) works, so no single job accumulates the whole batch on
# disk.
#
# How it works (GitLab dynamic child pipeline pattern):
#   1. `poc:generate-matrix`  discovers changed images and GENERATES a child
#      pipeline YAML with one build job per image.
#   2. `poc:run-builds`       triggers that generated child pipeline.
#   3. `poc:fan-in`           consolidates results after all builds finish
#      (POC-scale analogue of the real `save_results` step).
#
# IMPORTANT: this file is merged into the MR pipeline alongside the `infra`
# include. GitLab MERGES included configs, and a top-level `stages:` key in a
# later-included file REPLACES the stage list contributed by earlier includes —
# which would orphan infra jobs (e.g. `jobs-done-check-on-push`). To stay purely
# additive we therefore DO NOT declare `stages:` here and instead place every POC
# job on the always-present reserved `.pre` stage, ordering them with `needs:`.
# =============================================================================

variables:
  # Base ref to diff against for discovering changed images.
  POC_BASE_REF: "origin/master"
  # Image used to run the small python/git discovery step.
  POC_PY_IMAGE: "python:3.10-slim"

# -----------------------------------------------------------------------------
# Step 1: discover changed images and generate a child pipeline (one job/image)
# -----------------------------------------------------------------------------
poc:generate-matrix:
  stage: .pre
  image: "${POC_PY_IMAGE}"
  before_script:
    # git is needed for the diff-based discovery; slim images may lack it.
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    # Ensure the base ref is available for diffing in a shallow CI checkout.
    - git fetch --no-tags --depth=1 origin "${POC_BASE_REF#origin/}" || true
  script:
    - echo "Discovering changed images against ${POC_BASE_REF}..."
    - |
      python docker/parallel_poc/get_changed_images.py \
        --diff-compare "${POC_BASE_REF}...HEAD" \
        --format lines \
        --output changed_images.txt
    - echo "Changed images:" && cat changed_images.txt || true
    # Generate the child pipeline YAML: one build job per changed image.
    - python docker/parallel_poc/generate_child_pipeline.py \
        --images-file changed_images.txt \
        --output poc-child-pipeline.yml
    - echo "----- generated child pipeline -----" && cat poc-child-pipeline.yml
  artifacts:
    paths:
      - poc-child-pipeline.yml
      - changed_images.txt
    expire_in: 1 day

# -----------------------------------------------------------------------------
# Step 2: run the generated child pipeline (fans out to one job per image)
# -----------------------------------------------------------------------------
poc:run-builds:
  stage: .pre
  needs:
    - job: poc:generate-matrix
      artifacts: true
  trigger:
    include:
      - artifact: poc-child-pipeline.yml
        job: poc:generate-matrix
    strategy: depend

# -----------------------------------------------------------------------------
# Step 3: fan-in / consolidation (POC-scale analogue of the real `save_results`)
# -----------------------------------------------------------------------------
# The per-image builds run in the CHILD pipeline triggered by `poc:run-builds`.
# Because that trigger uses `strategy: depend`, `poc:run-builds` only succeeds
# once every child build job finishes, and this job only starts afterwards
# (enforced via `needs`). This is where the full implementation will merge
# per-image results, write carry-over state to GCS, and post the Slack summary.
# For the POC we just consolidate the metadata (the changed-image list).
#
# `when: always` so we still summarize even if a child build failed — the real
# save_results must run regardless to record failures for the next run.
poc:fan-in:
  stage: .pre
  image: "${POC_PY_IMAGE}"
  needs:
    - job: poc:generate-matrix
      artifacts: true
    - job: poc:run-builds
  when: always
  script:
    - 'echo "===== POC fan-in: consolidating per-image build results ====="'
    - 'COUNT=$(grep -c . changed_images.txt 2>/dev/null || echo 0); echo "Images dispatched to per-image build jobs: ${COUNT}"'
    - 'echo "Image list:"; cat changed_images.txt 2>/dev/null || echo "(none)"'
    - 'echo "TODO(full impl): merge results, write GCS carry-over, post Slack summary."'
    - 'echo "===== POC fan-in complete ====="'
